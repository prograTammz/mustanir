name: Build and deploy
on:
  push:
    branches: [main, redesign]
  workflow_dispatch:
permissions:
  contents: write # the release tag and the GitHub Release
  pages: write
  id-token: write
  pull-requests: write # "Shipped in Update N" on the PRs a release includes
concurrency:
  group: pages-${{ github.ref }}
  # A release on main is never cut off halfway (its number is already in the build); the next push waits its turn and
  # carries anything a newer push replaced. Preview builds just take the newest.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release number and notes come from the tags and the commits since the last one
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      # The game engine's rules (and the server's copy of them) must pass before anything ships.
      - run: bun test
        env:
          TZ: Africa/Cairo
      - run: npm install --no-audit --no-fund
      # scripts/release.mjs numbers this build and writes its notes (from PR summaries, or commit subjects).
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SINCE: ${{ github.event.before }}
      - name: Release notes
        run: node scripts/release.mjs --summary dist/version.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      - name: Publish the preview build to the build-preview branch
        if: github.ref != 'refs/heads/main'
        run: |
          cd dist
          git init -q -b build-preview
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Preview build of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Once it's live: the annotated tag v<major>.<N> (the record the next build reads), the GitHub Release, and a note on
  # each PR it shipped. Skipped when nothing reached the phone (docs, tests, Edge Functions).
  release:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: node scripts/release.mjs --publish dist/version.json
        env:
          GH_TOKEN: ${{ github.token }}
