  /* The boot screen: shown while the app loads, lifted by the app on its first frame. */
  #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0F4A3C; color: #D6AF5F; transition: opacity .35s ease, visibility .35s; }
  #boot.out { opacity: 0; visibility: hidden; }
  #boot svg { width: 104px; height: 104px; animation: boot-in .7s cubic-bezier(.2,.8,.2,1) both, boot-breathe 2.4s ease-in-out .7s infinite; }
  #boot .name { font: 600 26px/1.2 "Geeza Pro", "Reem Kufi", system-ui, sans-serif; direction: rtl; animation: boot-up .7s .12s cubic-bezier(.2,.8,.2,1) both; }
  #boot .bar { width: 72px; height: 2px; border-radius: 2px; overflow: hidden; background: rgb(214 175 95 / .22); animation: boot-up .7s .2s both; }
  #boot .who { position: absolute; bottom: max(env(safe-area-inset-bottom), 24px); margin-bottom: 40px; font: 500 13px/1.2 -apple-system, system-ui, sans-serif; letter-spacing: .04em; color: rgb(214 175 95 / .7); animation: boot-up .7s .3s both; }
  #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #D6AF5F; animation: boot-load 1.1s ease-in-out infinite; }
  @keyframes boot-in { from { opacity: 0; transform: scale(.82) rotate(-12deg); } }
  @keyframes boot-up { from { opacity: 0; transform: translateY(6px); } }
  @keyframes boot-breathe { 50% { transform: scale(1.04); } }
  @keyframes boot-load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { #boot *, #boot svg { animation: none !important; } }
</style>

<body>
<div id="boot" role="status" aria-label="Loading Al-Mustanir">
  <!-- The mark: the eight-pointed star as two interlaced squares, around a single point of light. -->
  <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#D6AF5F" stroke-width="6.5" stroke-linejoin="round"><rect x="21" y="21" width="58" height="58" rx="5"/><rect x="21" y="21" width="58" height="58" rx="5" transform="rotate(45 50 50)"/></g><circle cx="50" cy="50" r="8.5" fill="#D6AF5F"/></svg>
  <div class="name">المُستنير</div>
  <div class="bar"><i></i></div>
  <div class="who" id="boot-who"></div>
</div>
<script>
  // Your rank on the boot screen, from the last time the app saw it (a few bytes in localStorage).
  try { var p = JSON.parse(localStorage.getItem("a2-player") || "null"); if (p && p.level) document.getElementById("boot-who").textContent = "Level " + p.level + " · " + p.rank_en; } catch (e) {}
</script>
<script>
  // Shown for at least 600 ms so the brand moment reads; never longer than 8 s, whatever happens.
  (function () {
    var t0 = Date.now(), done = false;
    function lift() {
      if (done) return; done = true;
      var el = document.getElementById("boot"); if (!el) return;
      setTimeout(function () { el.classList.add("out"); setTimeout(function () { el.remove(); }, 400); }, Math.max(0, 600 - (Date.now() - t0)));
    }
    window.__mustanirReady = lift;
    setTimeout(lift, 8000);
  })();
</script>
<noscript>Al-Mustanir needs JavaScript.</noscript>
<div id="root"></div>
</body>
